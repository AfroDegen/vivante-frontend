
name: Unpack Vivante frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ ! -f vivante-frontend.zip ]; then
            echo "vivante-frontend.zip is missing from the repository root."
            exit 1
          fi

          mkdir -p /tmp/vivante-unpack
          unzip -o vivante-frontend.zip -d /tmp/vivante-unpack

          cp -R /tmp/vivante-unpack/vivante-frontend/. .

          rm -rf /tmp/vivante-unpack
          rm vivante-frontend.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Vivante frontend files" || echo "No changes to commit"
          git push
