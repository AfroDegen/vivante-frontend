
name: Unpack Vivante frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          test -f vivante-frontend.zip || {
            echo "ZIP not found in repository root"
            exit 1
          }

          mkdir -p /tmp/vivante
          unzip -o vivante-frontend.zip -d /tmp/vivante
          cp -R /tmp/vivante/vivante-frontend/. .
          rm -rf /tmp/vivante
          rm vivante-frontend.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack Vivante frontend" || exit 0
          git push
